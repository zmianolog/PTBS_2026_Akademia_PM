<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotkanie — Akademia Zarządzania Projektami PTBS</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
.gl{display:flex;align-items:center;gap:14px;margin:6px 0}
.gl .kd{width:64px;height:64px;border-radius:12px;background:var(--g);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.gl h1{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--tekst2);margin:8px 0 0}
.meta b{color:var(--tekst)}
.km{display:flex;align-items:flex-start;gap:10px;margin-top:10px;font-weight:700;color:var(--g);font-size:14px;line-height:1.35}
.km span{display:block;font-weight:400;color:var(--tekst2)}
.km i{flex:none;margin-top:3px;width:12px;height:12px;transform:rotate(45deg);background:var(--m);border:2px solid var(--g);border-radius:2px}
.zakladki{position:sticky;top:62px;z-index:5;background:#fff;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:18px 0 6px;padding:8px 0;border-bottom:2px solid var(--ramka)}
.zakladki button{min-height:48px;border:2px solid var(--g);border-radius:8px;background:#fff;color:var(--g);font:600 12px/1.2 var(--font);cursor:pointer;padding:4px 2px;hyphens:manual}
.zakladki button.akt{background:var(--g);color:#fff}
.blok{margin-top:18px}
.blok h3{border-bottom:2px solid var(--m);padding-bottom:4px;width:max-content;max-width:100%}
.lista2{display:grid;gap:10px}
.poz{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--ramka);border-radius:10px;padding:12px}
.poz .nzk{font-weight:700;color:var(--g);line-height:1.3}
.poz .rodz{font-size:12px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}
.poz .df{font-size:14px;color:var(--tekst2)}
.poz .akcja{margin-top:8px}
.poz .akcja .zml-btn{min-height:40px;font-size:14px;width:auto;min-width:200px}
.niedost{display:inline-block;font-size:13px;font-weight:600;color:#8A96A0;border:1.5px dashed var(--ramka);border-radius:6px;padding:3px 8px;margin-top:8px}
.kw{width:42px;height:42px;border-radius:8px;border:2px solid var(--mt);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.kw.nowe{background:var(--m);border-color:var(--m)} .kw .zi{--zi-rozmiar:24px} .kw.nowe .zi{--zi-linia:var(--g);--zi-akcent:#fff}
.zkod{width:42px;height:42px;border-radius:8px;background:var(--jasny);color:var(--g);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.komp{display:grid;gap:8px}
.komp .ikona{width:42px;height:42px}
.kroki{display:grid;gap:8px}
.kroki .karta{flex-direction:row;align-items:flex-start;gap:12px;padding:12px}
.dwa{display:grid;gap:12px}
.nawig{display:grid;grid-template-columns:1fr;gap:10px;margin-top:30px}
.nawig .zml-btn{width:100%;min-width:0}
@media (min-width:640px){ .komp,.kroki,.dwa,.lista2{grid-template-columns:1fr 1fr} .nawig{grid-template-columns:repeat(3,1fr)} .zakladki button{font-size:15px;padding:4px 6px} }
</style>
</head>
