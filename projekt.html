<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narzędziownik — Akademia Zarządzania Projektami PTBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wspolne.css">
<script src="wspolne.js"></script>
<script src="program.js"></script>
<script src="dok_dane.js"></script>
<script src="dok_definicje.js"></script>
<style>
.tp{width:100%;border-collapse:separate;border-spacing:6px;margin-top:10px;table-layout:fixed;min-width:760px}
.tp th:first-child{width:18%}
.tp th{background:var(--g);color:#fff;font-size:14px;font-weight:700;padding:10px;border-radius:8px;text-align:left;vertical-align:top;line-height:1.3}
.tp th small{display:block;font-weight:500;opacity:.85;font-size:12px}
.tp td{border:2px solid var(--ramka);border-radius:10px;padding:10px;vertical-align:top}
.tp td.narz{font-weight:700;color:var(--g);font-size:14px;background:var(--jasny);border-color:var(--jasny)}
.st{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--tlo);color:var(--tekst2);margin-bottom:6px}
.st.akc{background:#E6F3EA;color:var(--zielen)} .st.zm{background:#FDECEC;color:var(--czerwien)} .st.do{background:#FFF4D6;color:var(--mt)} .st.rob{background:var(--jasny);color:var(--g)}
.tp .kto{font-size:12px;color:var(--tekst2);margin-bottom:6px}
.tp .pr{display:grid;grid-template-columns:1fr;gap:6px;margin-top:4px}
.tp .zml-btn{min-height:42px;font-size:14px;padding:0 8px;width:100%;min-width:0;text-align:center}
.tp .zml-btn:disabled{opacity:.4;cursor:default}
.przewin{overflow-x:auto}
</style>
</head>
<body>
<div id="naglowek"></div>
<main class="wrap">
  <div id="podglad"></div>
  <div id="tresc"></div>
</main>
<div id="stopka"></div>
<script>
if (APM.wymagajLogowania()) (async () => {
  APM.naglowek(); APM.stopka();
  if (!PODGLAD) await APM.init();
  const $ = APM.$, JA = ja(), UCZ = JA.rola === 'uczestnik' || (JA.rola === 'test' && !!JA.zespol), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (PODGLAD) panelPodgladu($('#podglad'), () => '?podglad=1');
  const pg = PODGLAD ? '&podglad=1' : '';
  if (UCZ) {
    /* Narzędziownik zespołu: narzędzia pogrupowane według spotkań */
    if (!JA.zespol) { $('#tresc').innerHTML = '<h1>Narzędziownik</h1><p>Twój kod nie jest jeszcze przypisany do zespołu. Skontaktuj się z prowadzącym.</p>'; return; }
    document.title = 'Narzędziownik — Akademia Zarządzania Projektami PTBS';
    const sp = PROGRAM.sesje.filter(s => Object.values(PROGRAM.toolkit).some(n => n.od === s.kod));
    $('#tresc').innerHTML = `<h1>Narzędziownik</h1>` + sp.map(s => `<div class="nk-grupa">${s.kod}<small>${esc(s.nazwa)}</small></div>
      <div class="nk-siatka">${Object.keys(PROGRAM.toolkit).filter(t => PROGRAM.toolkit[t].od === s.kod).sort().map(t => kafelNarzedzia(t, `dokument.html?t=${t}${pg}`)).join('')}</div>`).join('');
    return;
  }
  /* Projekty: tabela dokumentów zespołów; sponsor otwiera pełny dokument w PDF i akceptuje */
  document.title = 'Projekty — Akademia Zarządzania Projektami PTBS';
  const Z = Object.keys(PROGRAM.zespoly), N = Object.keys(PROGRAM.toolkit).filter(narzedzieAktywne).sort((a, b) => PROGRAM.toolkit[a].od.localeCompare(PROGRAM.toolkit[b].od) || a.localeCompare(b));
  const ZARZ = JA.rola === 'zarzad', DOK = {};
  await Promise.all(Z.flatMap(z => N.map(async t => { try { DOK[z + '_' + t] = await DANE.czytaj(z + '_' + t); } catch (e) { DOK[z + '_' + t] = null; } })));
  const KL = { akc: 'akc', zm: 'zm', do: 'do', '': 'rob' };
  const dt = s => new Date(s).toLocaleString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const dok = (z, t) => DOK[z + '_' + t] || { pola: {}, kroki: {}, wersja: 0 };
  const poKM1 = () => { const c = czasTerminu((typeof TERMINY_WSZYSTKIE !== 'undefined' ? TERMINY_WSZYSTKIE : {}).D06); return !!(c && c <= new Date()); };
  function kom(z, t) {
    const D = dok(z, t), ID = z + '_' + t, [k, st] = stanDokumentu(D);
    const czeka = D.doAkc && (!D.akc || D.doAkc.kiedy > D.akc.kiedy);
    const km1 = t === 'T01' && D.akc && !czeka && !D.potw && poKM1();
    let info = '';
    if (D.akc && !czeka) info += `<div class="kto">${esc(D.akc.kto)}, ${dt(D.akc.kiedy)}</div>`;
    if (D.potw) info += `<div class="kto">Wartość potwierdzona po diagnozie: ${esc(D.potw.kto)}, ${dt(D.potw.kiedy)}</div>`;
    const akcBtn = ZARZ ? (km1 ? `<button class="zml-btn" data-potw="${ID}">Akceptuję wartość po diagnozie</button>` : `<button class="zml-btn" data-akc="${ID}" ${czeka ? '' : 'disabled title="Zespół nie przekazał dokumentu do akceptacji"'}>Akceptuję</button>`) : '';
    const jsonBtn = JA.rola === 'prowadzacy' ? `<button class="zml-btn" data-json="${ID}">Dane dokumentu (JSON)</button>` : '';
    return `<td><span class="st ${D.wersja ? KL[k] : ''}">${st}</span>${info}<div class="pr${ZARZ ? '' : ' jeden'}"><a class="zml-btn" href="dokument.html?t=${t}&z=${z}${pg}&pdf=1" target="_blank" rel="noopener">Pełny dokument (PDF)</a>${akcBtn}${jsonBtn}</div></td>`;
  }
  function rysuj() {
    $('#tresc').innerHTML = `<h1>Projekty</h1>` + (N.length ? `<div class="przewin"><table class="tp"><tr><th>Dokument</th>${Z.map(z => `<th>${z}<small>${esc(PROGRAM.zespoly[z].projekt)}</small></th>`).join('')}</tr>
      ${N.map(t => `<tr><td class="narz">${t} ${esc(PROGRAM.toolkit[t].n)}</td>${Z.map(z => kom(z, t)).join('')}</tr>`).join('')}</table></div>` : '<p>Żadne narzędzie nie jest jeszcze aktywne.</p>');
    document.querySelectorAll('[data-akc]').forEach(b => b.addEventListener('click', async () => { const ID = b.dataset.akc;
      DOK[ID] = await DANE.zmien(ID, d => { d.akc = { decyzja: 'akceptuję', uwagi: '', kto: JA.imie, kiedy: new Date().toISOString(), wersja: d.wersja }; }); rysuj(); }));
    document.querySelectorAll('[data-json]').forEach(b => b.addEventListener('click', async () => { const ID = b.dataset.json; let hist = [];
      try { hist = await DANE.hist(ID); } catch (e) {}
      const dane = { dokument: ID, pobrano: new Date().toISOString(), dane: DOK[ID] || null, historia: hist };
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(dane, null, 2)], { type: 'application/json' }));
      a.download = `PTBS_2026_APM_${ID}_${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove(); }));
    document.querySelectorAll('[data-potw]').forEach(b => b.addEventListener('click', async () => { const ID = b.dataset.potw;
      DOK[ID] = await DANE.zmien(ID, d => { d.potw = { kto: JA.imie, kiedy: new Date().toISOString(), uwagi: '' }; }); rysuj(); }));
  }
  rysuj();
})();
</script>
</body>
</html>
