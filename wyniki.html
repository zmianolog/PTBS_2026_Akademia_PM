<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyniki grupy — Akademia Zarządzania Projektami PTBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wspolne.css">
<script src="wspolne.js"></script>
<style>
.radar-uklad{display:grid;gap:16px;margin-top:10px}
.radar{width:100%;max-width:560px;margin:0 auto;display:block;overflow:visible}
.radar .siec{fill:none;stroke:var(--ramka);stroke-width:1.5}
.radar .os{stroke:var(--ramka);stroke-width:1.5}
.radar .pole{fill:rgba(31,68,96,.18);stroke:var(--g);stroke-width:3}
.radar .pole2{fill:rgba(232,182,44,.22);stroke:var(--m);stroke-width:3}
.radar .pkt{fill:var(--g)}
.radar .etyk{font:600 12px var(--font);fill:var(--tekst2)}
.radar .ik{cursor:pointer}
.radar .ik circle{fill:#fff;stroke:var(--g);stroke-width:2.5}
.radar .ik.spol circle{fill:var(--g)}
.radar .ik.wyb circle,.radar .ik:focus circle{stroke:var(--m);stroke-width:5}
.radar .ik:focus{outline:none}
.radar .ik.spol .zi{--zi-linia:#fff;--zi-akcent:var(--m)}
.opis-k{border:2px solid var(--g);border-radius:12px;padding:16px}
.opis-k .nz{font-weight:700;color:var(--g);font-size:17px;margin-bottom:6px}
.rozk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rozk div{background:var(--jasny);border-radius:8px;padding:8px;text-align:center;font-size:13px}
.rozk b{display:block;font-size:18px;color:var(--g)}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-top:8px}
.leg i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
@media (min-width:1000px){ .radar-uklad{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start} }
</style>
</head>
<body>
<div id="naglowek"></div>
<main class="wrap">
  <span class="nadtytul">Wyniki grupy</span>
  <h1>Profil kompetencji grupy</h1>
  <p class="lead">Wykres pokazuje średnią samoocenę uczestników Akademii w każdej z dwunastu kompetencji, w skali od 1 do 4. Wyniki są zbiorcze; strona nie pokazuje odpowiedzi poszczególnych osób. Kliknij ikonę, aby zobaczyć opis kompetencji i rozkład odpowiedzi.</p>
  <div id="stanW"></div>
  <div id="wykres"></div>
</main>
<div id="stopka"></div>
<script>
const SKALA=['Nie wykonywałem takich działań albo nie wiem, jak je wykonać.','Wykonywałem je z pomocą innych osób albo tylko częściowo.','Wykonuję je samodzielnie w typowych sytuacjach.','Wykonuję je samodzielnie także w trudnych sytuacjach i mogę pokazać innym, jak to robić.'];
const MIN_N=3;
if(APM.wymagajLogowania()) (async()=>{
  APM.naglowek(); APM.stopka(); await APM.init();
  const $=APM.$;
  if(APM.rola()!=='zarzad'){ $('#stanW').innerHTML='<div class="ramka-info">Ta strona jest dostępna dla Zarządu.</div>'; return; }
  const P1=await APM.wczytaj('zbiorcze','P1'), P2=await APM.wczytaj('zbiorcze','P2');
  if(!P1||P1.n<MIN_N){ $('#stanW').innerHTML=`<div class="ramka-info">Wyniki zbiorcze pojawią się, gdy samoocenę zapisze co najmniej ${MIN_N} uczestników${P1?` (obecnie: ${P1.n})`:''}.</div>`; return; }
  const jestP2=P2&&P2.n>=MIN_N;
  $('#stanW').innerHTML=`<p><span class="stan ok">Na początku Akademii: ${P1.n} os.</span> ${jestP2?`<span class="stan do">Na zakończenie: ${P2.n} os.</span>`:''} <span style="font-size:13px;color:var(--tekst2)">Stan z dnia ${new Date(P1.opublikowano).toLocaleDateString('pl-PL')}</span></p>`;
  const N=KOMPETENCJE.length, C=300, R=190, kat=i=>(-90+i*360/N)*Math.PI/180;
  const pt=(i,v)=>[C+R*v/4*Math.cos(kat(i)), C+R*v/4*Math.sin(kat(i))];
  let g='';
  for(let l=1;l<=4;l++) g+=`<polygon class="siec" points="${KOMPETENCJE.map((k,i)=>pt(i,l).join(',')).join(' ')}"/>`;
  KOMPETENCJE.forEach((k,i)=>{const [x,y]=pt(i,4); g+=`<line class="os" x1="${C}" y1="${C}" x2="${x}" y2="${y}"/>`;});
  g+=`<polygon class="pole" points="${KOMPETENCJE.map((k,i)=>pt(i,P1.srednie[k.k]||0).join(',')).join(' ')}"/>`;
  if(jestP2) g+=`<polygon class="pole2" points="${KOMPETENCJE.map((k,i)=>pt(i,P2.srednie[k.k]||0).join(',')).join(' ')}"/>`;
  [1,2,3,4].forEach(l=>{const [x,y]=pt(0,l); g+=`<text class="etyk" x="${x+6}" y="${y+4}">${l}</text>`;});
  KOMPETENCJE.forEach((k,i)=>{ const [x,y]=pt(i,5.15), ic=IKONY[k.ik];
    g+=`<g class="ik ${k.k[0]==='S'?'spol':''}" tabindex="0" role="button" data-i="${i}" aria-label="${k.n}"><circle cx="${x}" cy="${y}" r="28"/><svg class="zi zi-r-${ic.r}" x="${x-15}" y="${y-15}" width="30" height="30" viewBox="0 0 24 24">${ic.s}</svg></g>`; });
  $('#wykres').innerHTML=`<div class="leg"><span><i style="background:rgba(31,68,96,.35);border:2px solid var(--g)"></i>Na początku Akademii</span>${jestP2?'<span><i style="background:rgba(232,182,44,.35);border:2px solid var(--m)"></i>Na zakończenie Akademii</span>':''}</div>
    <div class="radar-uklad"><svg class="radar" viewBox="-20 -20 640 640" role="img" aria-label="Profil grupy">${g}</svg><div class="opis-k" id="opisK"></div></div>`;
  const f=v=>v==null?'—':v.toFixed(2).replace('.',',');
  const pokaz=i=>{ const k=KOMPETENCJE[i], r=P1.rozklad[k.k]||[0,0,0,0];
    document.querySelectorAll('.ik').forEach(e=>e.classList.toggle('wyb',+e.dataset.i===i));
    $('#opisK').innerHTML=`<div class="nz">${k.n}</div><div style="font-size:13px;color:var(--tekst2)">${k.k[0]==='M'?'Kompetencja merytoryczna · '+k.faza:'Kompetencja społeczna · przez cały projekt'}</div>
      <p style="margin:8px 0">${k.d}</p><p style="margin:0 0 4px"><b>Średnia na początku: ${f(P1.srednie[k.k])}</b>${jestP2?` · <b>na zakończenie: ${f(P2.srednie[k.k])}</b>`:''}</p>
      <div style="font-size:13px;color:var(--tekst2)">Liczba osób, które wybrały dany poziom (na początku):</div>
      <div class="rozk">${r.map((c,j)=>`<div title="${SKALA[j]}"><b>${c}</b>poziom ${j+1}</div>`).join('')}</div>`; };
  document.querySelectorAll('.ik').forEach(e=>{ e.addEventListener('click',()=>pokaz(+e.dataset.i)); e.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pokaz(+e.dataset.i);} }); });
  pokaz(0);
})();
</script>
</body>
</html>
