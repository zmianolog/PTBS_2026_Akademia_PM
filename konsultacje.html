<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konsultacje — Akademia Zarządzania Projektami PTBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wspolne.css">
<script src="wspolne.js"></script>
<script src="program.js"></script>
<script src="dok_dane.js"></script>
<style>
.kz-zasady{background:var(--jasny);border-radius:12px;padding:12px 16px;margin:10px 0 18px;font-size:15px}
.kz-zasady ul{margin:4px 0 0;padding-left:20px}
.kz-dzien{margin-top:18px}
.kz-dzien h2{font-size:17px;color:var(--g);margin:0 0 8px}
.kz-sloty{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:799px){ .kz-sloty{grid-template-columns:1fr} }
.kz-slot{border:2px solid var(--ramka);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.kz-slot b{font-size:18px;color:var(--g)}
.kz-slot .st{font-size:13px;font-weight:700;color:var(--tekst2)}
.kz-slot.wolny{border-color:var(--g)}
.kz-slot.nasz{border-color:var(--zielen);background:#F1F8F3}
.kz-slot.zajety{background:var(--tlo)}
.kz-slot textarea{width:100%;box-sizing:border-box;min-height:56px;font:14px var(--font);border:2px solid var(--ramka);border-radius:8px;padding:6px 8px}
.kz-slot .zml-btn{min-height:42px;width:100%;font-size:14px}
.kz-slot .zml-btn:disabled{opacity:.4;cursor:default}
.kz-brak{color:var(--tekst2)}
.kz-tab{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.kz-tab th,.kz-tab td{border:1px solid var(--ramka);padding:6px 8px;text-align:left;vertical-align:top}
.kz-tab th{background:var(--jasny);color:var(--g)}
.kz-licznik{display:inline-block;background:var(--g);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;margin-top:6px}
</style>
</head>
<body>
<div id="naglowek"></div>
<main class="wrap">
  <div id="podglad"></div>
  <div id="tresc"></div>
</main>
<div id="stopka"></div>
<!-- formularz dla Netlify Forms: powiadomienie mailem o zapisie i odwołaniu -->
<form name="konsultacje" data-netlify="true" netlify-honeypot="pole_bot" hidden>
  <input name="zdarzenie"><input name="zespol"><input name="kto"><input name="termin"><input name="temat"><input name="pole_bot">
</form>
<script>
if (APM.wymagajLogowania()) (async () => {
  APM.naglowek(); APM.stopka();
  if (!PODGLAD) await APM.init();
  const $ = APM.$, JA = ja(), K = KONSULTACJE, UCZ = JA.rola === 'uczestnik' || (JA.rola === 'test' && !!JA.zespol), PROW = JA.rola === 'prowadzacy';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (PODGLAD) panelPodgladu($('#podglad'), () => '?podglad=1');
  const DNI = ['niedziela', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota'];
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const ladnie = d => `${DNI[d.getDay()]} ${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`;
  const zDaty = (dz, g) => { const [r, m, d] = dz.split('-').map(Number), [h, mi] = g.split(':').map(Number); return new Date(r, m - 1, d, h, mi); };
  const tydzien = dz => { const d = zDaty(dz, '12:00'); const pon = new Date(d); pon.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(pon); };

  /* ===== dane: podgląd w tej przeglądarce albo baza Firebase ===== */
  const LS = 'apm_konsultacje';
  const B = PODGLAD ? {
    async wszystkie() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } },
    async zapisz(id, d) { const w = await this.wszystkie(); if (w[id]) return false; w[id] = d; localStorage.setItem(LS, JSON.stringify(w)); return true; },
    async usun(id) { const w = await this.wszystkie(); delete w[id]; localStorage.setItem(LS, JSON.stringify(w)); }
  } : {
    async wszystkie() { const { db, fs } = APM.baza(); const s = await fs.getDocs(fs.collection(db, 'konsultacje')); const w = {}; s.forEach(x => w[x.id] = x.data()); return w; },
    async zapisz(id, d) { const { db, fs } = APM.baza(), ref = fs.doc(db, 'konsultacje', id);
      return fs.runTransaction(db, async t => { const s = await t.get(ref); if (s.exists()) return false; t.set(ref, d); return true; }); },
    async usun(id) { const { db, fs } = APM.baza(); await fs.deleteDoc(fs.doc(db, 'konsultacje', id)); }
  };
  /* powiadomienie mailem przez Netlify Forms (działa tylko na opublikowanej stronie) */
  const powiadom = d => { if (PODGLAD) return; try { fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(Object.assign({ 'form-name': 'konsultacje' }, d)).toString() }); } catch (e) {} };

  /* sloty z najbliższych tygodni */
  function sloty() {
    const teraz = new Date(), dni = [];
    K.terminy.slice().sort().forEach(dz => { const s = K.sloty.filter(g => zDaty(dz, g) > teraz); if (s.length) dni.push({ dz, d: zDaty(dz, '12:00'), s }); });
    return dni.slice(0, 3);
  }
  const mozeOdwolac = dz => new Date() < zDaty(dz, '00:00');
  let W = {};
  async function rysuj() {
    try { W = await B.wszystkie(); } catch (e) { console.warn(e); W = {}; }
    const zesp = JA.zespol, dni = sloty();
    let h = `<h1>Konsultacje</h1><div class="kz-zasady"><b>Zasady</b><ul>
      <li>Konsultacje odbywają się w Teams, w terminach podanych poniżej, w slotach po ${K.minut} minut.</li>
      <li>Zapisuje się zespół. Każdy zespół może mieć jeden slot w tygodniu.</li>
      <li>Przy zapisie wpiszcie, z jakim problemem projektowym przychodzicie.</li>
      <li>Zapis można odwołać najpóźniej dzień przed konsultacją.</li></ul></div>`;
    if (!dni.length) h += '<p class="kz-brak">Nie ma jeszcze kolejnych terminów konsultacji. Prowadzący poda je na najbliższym spotkaniu.</p>';
    dni.forEach(({ dz, d, s }) => {
      h += `<section class="kz-dzien"><h2>${ladnie(d)}</h2>`;
      const tyg = tydzien(dz), naszWTyg = Object.entries(W).some(([id, x]) => x.zespol === zesp && x.tydzien === tyg);
      h += '<div class="kz-sloty">' + s.map(g => { const id = `${dz}_${g.replace(':', '')}`, x = W[id];
        if (x && x.zespol === zesp && UCZ) return `<div class="kz-slot nasz"><b>${g}</b><span class="st">Wasz zespół · zapisał(a): ${esc(x.kto)}</span><div>${esc(x.temat)}</div>
          ${K.teams ? `<a class="zml-btn" href="${esc(K.teams)}" target="_blank" rel="noopener">Dołącz w Teams</a>` : ''}
          ${mozeOdwolac(dz) ? `<button class="zml-btn" data-odw="${id}">Odwołaj zapis</button>` : ''}</div>`;
        if (x) return `<div class="kz-slot zajety"><b>${g}</b><span class="st">Zajęty · ${esc(x.zespol)}</span>${PROW ? `<div>${esc(x.kto)}: ${esc(x.temat)}</div><button class="zml-btn" data-odw="${id}">Usuń zapis</button>` : ''}</div>`;
        if (!UCZ) return `<div class="kz-slot"><b>${g}</b><span class="st">Wolny</span></div>`;
        if (!zesp) return `<div class="kz-slot"><b>${g}</b><span class="st">Wolny</span><span class="kz-brak">Twój kod nie jest przypisany do zespołu.</span></div>`;
        return `<div class="kz-slot wolny"><b>${g}</b><span class="st">Wolny</span>${naszWTyg ? '<span class="kz-brak">Wasz zespół ma już slot w tym tygodniu.</span>' :
          `<textarea id="t-${id}" placeholder="Z jakim problemem przychodzicie?"></textarea><button class="zml-btn" data-zap="${id}|${dz}|${g}">Zapisz zespół ${esc(zesp)}</button>`}</div>`;
      }).join('') + '</div></section>';
    });
    if (PROW) {
      const L = Object.entries(W).sort((a, b) => a[0].localeCompare(b[0])), odbyte = L.filter(([id]) => zDaty(id.slice(0, 10), id.slice(11, 13) + ':' + id.slice(13)) < new Date());
      h += `<section class="kz-dzien"><h2>Wszystkie zapisy</h2><span class="kz-licznik">Wykorzystano ${(odbyte.length * K.minut / 60).toLocaleString('pl-PL')} z ${K.pula} godz.</span>
        ${L.length ? `<table class="kz-tab"><tr><th>Termin</th><th>Zespół</th><th>Kto</th><th>Temat</th></tr>${L.map(([id, x]) => `<tr><td>${id.slice(0, 10)} ${id.slice(11, 13)}:${id.slice(13)}</td><td>${esc(x.zespol)}</td><td>${esc(x.kto)}</td><td>${esc(x.temat)}</td></tr>`).join('')}</table>` : '<p class="kz-brak">Brak zapisów.</p>'}</section>`;
    }
    $('#tresc').innerHTML = h;
    document.querySelectorAll('[data-zap]').forEach(b => b.addEventListener('click', async () => {
      const [id, dz, g] = b.dataset.zap.split('|'), temat = $('#t-' + id).value.trim();
      if (!temat) { $('#t-' + id).focus(); $('#t-' + id).placeholder = 'Wpiszcie temat konsultacji'; return; }
      b.disabled = true;
      const d = { zespol: JA.zespol, kto: JA.imie, temat, kiedy: new Date().toISOString(), tydzien: tydzien(dz) };
      let ok = false; try { ok = await B.zapisz(id, d); } catch (e) { console.warn(e); }
      if (ok) powiadom({ zdarzenie: 'zapis', zespol: d.zespol, kto: d.kto, termin: `${dz} ${g}`, temat });
      else alert('Ten slot został właśnie zajęty albo zapis się nie udał. Wybierzcie inny termin.');
      rysuj();
    }));
    document.querySelectorAll('[data-odw]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.odw, x = W[id]; b.disabled = true;
      try { await B.usun(id); powiadom({ zdarzenie: 'odwołanie', zespol: x.zespol, kto: JA.imie, termin: `${id.slice(0, 10)} ${id.slice(11, 13)}:${id.slice(13)}`, temat: x.temat }); } catch (e) { console.warn(e); }
      rysuj();
    }));
  }
  rysuj();
})();
</script>
</body>
</html>
