<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrukcja — Akademia Zarządzania Projektami PTBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wspolne.css">
<script src="wspolne.js"></script>
<script src="program.js"></script>
<script src="dok_dane.js"></script>
<script src="dok_definicje.js"></script>
<style>
.ins-gl{display:grid;gap:10px;margin:14px 0}
@media (min-width:800px){ .ins-gl{grid-template-columns:1fr 1fr} }
.ins-k{border:2px solid var(--ramka);border-radius:12px;padding:12px 14px}
.ins-k b{display:block;color:var(--g);margin-bottom:4px}
.ins-sek{margin-top:22px}
.ins-sek h2{background:var(--g);color:#fff;font-size:17px;padding:8px 12px;border-radius:8px}
.ins-pole{margin-top:14px}
.ins-pole h3{font-size:16px;margin-bottom:4px}
@media print{ .naglowek,.stopka,#drukBtn{display:none!important} .wy{break-inside:avoid} .ins-sek h2{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
</style>
</head>
<body>
<div id="naglowek"></div>
<main class="wrap"><div id="tresc"></div></main>
<div id="stopka"></div>
<script>
if (APM.wymagajLogowania()) {
  APM.naglowek(); APM.stopka();
  const $ = APM.$, T = new URLSearchParams(location.search).get('t') || 'T01', D = DOKUMENTY[T];
  const e = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.title = 'Instrukcja: ' + D.nazwa + ' — Akademia Zarządzania Projektami PTBS';
  const pola = s => (s.pola || []).flatMap(p => p.dod ? [p, p.dod] : [p]).filter(p => p.wyj);
  $('#tresc').innerHTML = `<span class="nadtytul">${T} · Instrukcja</span><h1>${e(D.nazwa)}</h1>
    <div class="przyciski" style="max-width:420px"><button class="zml-btn" id="drukBtn">Drukuj lub zapisz PDF</button></div>
    <div class="ins-gl">
      <div class="ins-k"><b>Po co</b>${e(D.instr.po)}</div><div class="ins-k"><b>Kto wypełnia</b>${e(D.instr.kto)}</div>
      <div class="ins-k"><b>Kiedy</b>${e(D.instr.kiedy)}</div><div class="ins-k"><b>Kto akceptuje</b>${e(D.instr.akc)}</div>
    </div>
    ${D.sekcje.filter(s => !s.akceptacja).map(s => `<section class="ins-sek"><h2>${s.nr}. ${e(s.t)}</h2>${s.wstep ? `<p style="margin-top:8px">${e(s.wstep)}</p>` : ''}
      ${pola(s).map(p => `<div class="ins-pole"><h3>${e(p.et)}</h3><div class="wy">${htmlWyjasnienia(p.wyj)}</div></div>`).join('')}</section>`).join('')}`;
  $('#drukBtn').addEventListener('click', () => window.print());
}
</script>
</body>
</html>
